    font-family: var(--mono);
    color: var(--off-white);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ─── SCANLINES ─── */
  .scanlines {
    position: fixed; inset: 0; z-index: 100;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
    );
  }

  /* ─── CRT VIGNETTE ─── */
  .vignette {
    position: fixed; inset: 0; z-index: 99;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  }

  /* ─── SCREENS ─── */
  .screen { display: none; position: fixed; inset: 0; z-index: 10; }
  .screen.active { display: flex; }

  /* ═══════════════════════════════════════════════
     SCREEN 1: CODE + REGISTRATION
     ═══════════════════════════════════════════════ */
  .entry-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(24px + var(--sat)) 24px calc(24px + var(--sab));
    background: var(--black);
    z-index: 20;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .entry-logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .entry-logo-row img.logo-salentino { height: 24px; width: auto; }
  .entry-logo-row .logo-x {
    font-size: 10px; font-weight: 700;
    color: var(--green); opacity: 0.5; letter-spacing: 2px;
  }
  .entry-logo-row img.logo-ritvales { height: 22px; width: auto; }

  .entry-tagline {
    font-size: 9px; font-weight: 700;
    color: var(--green); letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(130,253,71,0.3);
    margin-bottom: 20px;
  }

  .entry-title {
    font-size: clamp(18px, 5vw, 24px);
    font-weight: 700;
    color: var(--off-white);
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }

  .entry-sub {
    font-size: 10px;
    color: var(--steel);
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 20px;
    opacity: 0.6;
  }

  .form-section {
    width: 100%;
    max-width: 360px;
  }

  .form-group {
    position: relative;
    margin-bottom: 10px;
  }

  .form-group input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(130,253,71,0.15);
    border-radius: 10px;
    padding: 13px 16px 13px 40px;
    font-family: var(--mono);
    font-size: 16px;
    color: var(--off-white);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  .form-group input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(130,253,71,0.08);
  }
  .form-group input::placeholder { color: rgba(239,255,254,0.2); font-size: 13px; }
  .form-group input.error { border-color: var(--red); }

  .form-group .field-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 14px; opacity: 0.4;
    pointer-events: none;
  }

  .code-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    width: 100%;
    max-width: 360px;
  }
  .code-divider::before, .code-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(130,253,71,0.12);
  }
  .code-divider span {
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--green);
    opacity: 0.4;
  }

  .error-msg {
    display: none;
    font-size: 10px;
    color: var(--red);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 1px;
    animation: shakeErr 0.3s ease;
  }
  .error-msg.visible { display: block; }

  @keyframes shakeErr {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .btn-go {
    width: 100%;
    max-width: 360px;
    background: var(--green);
    color: var(--black);
    border: none;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 12px;
    transition: transform 0.1s, box-shadow 0.2s;
    min-height: 52px;
    box-shadow: 0 4px 20px rgba(130,253,71,0.2);
  }
  .btn-go:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px rgba(130,253,71,0.4);
  }
  .btn-go:disabled { opacity: 0.4; pointer-events: none; }

  .consent-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: 360px;
    margin-top: 14px;
  }
  .consent-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    min-width: 20px;
    margin-top: 2px;
    accent-color: var(--green);
    cursor: pointer;
  }
  .consent-row label {
    font-size: 9px;
    color: rgba(239,255,254,0.45);
    line-height: 1.5;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .consent-row label a {
    color: var(--green);
    text-decoration: underline;
    opacity: 0.7;
  }
  .consent-row.error-consent label {
    color: var(--red);
  }
  .consent-row.error-consent input[type="checkbox"] {
    outline: 2px solid var(--red);
    outline-offset: 1px;
  }

  .attempts-warn {
    display: none;
    font-size: 9px;
    color: var(--red);
    text-align: center;
    margin-top: 6px;
    letter-spacing: 1px;
    opacity: 0.7;
  }
  .attempts-warn.visible { display: block; }

  /* ═══════════════════════════════════════════════
     SCREEN 2: WHEEL
     ═══════════════════════════════════════════════ */
  .wheel-screen {
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: calc(8px + var(--sat)) 16px calc(8px + var(--sab));
    background: var(--black);
    z-index: 20;
  }

  .header {
    text-align: center;
    flex-shrink: 0;
    width: 100%;
    padding-top: 4px;
  }

  .logo-row {
    display: flex; align-items: center;
    justify-content: center; gap: 16px;
    margin-bottom: 6px;
  }
  .logo-row img.logo-salentino { height: 28px; width: auto; }
  .logo-row .logo-x {
    font-size: 12px; font-weight: 700;
    color: var(--green); opacity: 0.5; letter-spacing: 2px;
  }
  .logo-row img.logo-ritvales { height: 26px; width: auto; }

  .tagline {
    font-size: 11px; font-weight: 700;
    color: var(--green); letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(130,253,71,0.3);
  }

  .player-name {
    font-size: 10px;
    color: var(--steel);
    letter-spacing: 2px;
    margin-top: 4px;
    opacity: 0.5;
  }

  .wheel-section {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    width: 100%;
    min-height: 0;
    position: relative;
  }

  .wheel-wrap {
    position: relative;
    width: min(88vw, calc(100dvh - 170px));
    height: min(88vw, calc(100dvh - 170px));
    max-width: 480px;
    max-height: 480px;
  }

  .wheel-wrap::before {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(130,253,71,0.15);
    box-shadow: 0 0 30px rgba(130,253,71,0.08), inset 0 0 30px rgba(130,253,71,0.04);
    pointer-events: none;
  }

  .pointer {
    position: absolute;
    top: -16px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid var(--green);
    filter: drop-shadow(0 0 14px rgba(130,253,71,0.8));
    transition: filter 0.08s;
  }
  .pointer.tick {
    filter: drop-shadow(0 0 24px #fff);
    border-top-color: #fff;
  }

  canvas#wheelCanvas {
    width: 100%; height: 100%;
    border-radius: 50%;
  }

  .center-hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: var(--black);
    border: 4px solid rgba(130,253,71,0.5);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 30px rgba(130,253,71,0.3),
      0 0 60px rgba(130,253,71,0.1),
      inset 0 0 20px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .center-hub .hub-gif {
    width: 110%; height: 110%;
    object-fit: cover;
    border-radius: 50%;
  }

  .footer {
    flex-shrink: 0;
    text-align: center;
    width: 100%;
  }
  .footer .breakfast-tag {
    font-size: 8px; letter-spacing: 3px;
    color: var(--steel); opacity: 0.35;
    margin-bottom: 2px;
  }
  .footer .counter {
    font-size: 10px;
    color: var(--green);
    letter-spacing: 2px;
    opacity: 0.6;
  }

  /* ═══════════════════════════════════════════════
     SCREEN 3: RESULT (PERMANENT)
     ═══════════════════════════════════════════════ */
  .result-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    background: var(--black);
    z-index: 30;
  }

  .result-screen .r-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: iconPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes iconPop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    60% { transform: scale(1.3) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .result-screen .r-phrase {
    font-size: 10px; letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 6px; opacity: 0.7;
    animation: fadeSlide 0.5s 0.2s both;
  }

  .result-screen .r-label {
    font-size: 11px; letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 8px; opacity: 0.6;
    animation: fadeSlide 0.5s 0.3s both;
  }
  .result-screen .r-name {
    font-size: clamp(22px, 7vw, 34px);
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 40px rgba(130,253,71,0.25);
    line-height: 1.15;
    margin-bottom: 12px;
    max-width: 320px;
    animation: fadeSlide 0.5s 0.4s both;
  }
  .result-screen .r-desc {
    font-size: 13px;
    color: var(--steel);
    line-height: 1.7;
    max-width: 300px;
    margin-bottom: 28px;
    opacity: 0.8;
    animation: fadeSlide 0.5s 0.5s both;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-screen .r-code {
    display: none;
    background: rgba(130,253,71,0.06);
    border: 1.5px dashed var(--green);
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 18px; font-weight: 700;
    color: var(--green); letter-spacing: 4px;
    margin-bottom: 20px;
    cursor: pointer;
    animation: fadeSlide 0.5s 0.6s both;
  }
  .result-screen .r-code.visible { display: block; }
  .result-screen .r-code .tap-hint {
    display: block; font-size: 7px;
    color: var(--steel); letter-spacing: 2px;
    margin-top: 4px; font-weight: 400; opacity: 0.5;
  }

  .result-screen .r-staff {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--orange);
    border: 1px solid rgba(236,110,37,0.3);
    padding: 10px 20px;
    border-radius: 8px;
    animation: fadeSlide 0.5s 0.7s both;
    text-transform: uppercase;
  }

  .result-screen .r-player {
    font-size: 9px;
    color: var(--steel);
    opacity: 0.3;
    margin-top: 16px;
    letter-spacing: 2px;
    animation: fadeSlide 0.5s 0.8s both;
  }

  /* Winner variant */
  .result-screen.winner { background: linear-gradient(180deg, #1a0600 0%, var(--black) 50%); }
  .result-screen.winner .r-name { color: var(--orange); text-shadow: 0 0 50px rgba(236,110,37,0.35); }
  .result-screen.winner .r-phrase { color: var(--orange); }

  /* ─── ALREADY PLAYED ─── */
  .played-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    background: var(--black);
    z-index: 30;
  }

  .played-card {
    background: linear-gradient(160deg, rgba(130,253,71,0.06) 0%, rgba(125,59,237,0.04) 100%);
    border: 1.5px solid rgba(130,253,71,0.15);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 320px;
    width: 100%;
    margin-bottom: 20px;
  }

  .played-card .played-icon {
    font-size: 56px;
    margin-bottom: 12px;
  }
  .played-card .played-label {
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--steel);
    opacity: 0.5;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .played-card .played-prize {
    font-size: clamp(20px, 6vw, 28px);
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 30px rgba(130,253,71,0.2);
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .played-card .played-desc {
    font-size: 11px;
    color: var(--steel);
    line-height: 1.6;
    opacity: 0.7;
    margin-bottom: 14px;
  }
  .played-card .played-code {
    display: none;
    background: rgba(130,253,71,0.06);
    border: 1.5px dashed var(--green);
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 16px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 4px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .played-card .played-code.visible { display: block; }
  .played-card .played-code .tap-hint {
    display: block;
    font-size: 7px;
    color: var(--steel);
    letter-spacing: 2px;
    margin-top: 3px;
    font-weight: 400;
    opacity: 0.5;
  }
  .played-card .played-player {
    font-size: 9px;
    color: var(--steel);
    opacity: 0.3;
    letter-spacing: 2px;
    margin-top: 8px;
  }

  .played-card .played-divider {
    width: 40px;
    height: 1px;
    background: rgba(130,253,71,0.15);
    margin: 14px auto;
  }

  .played-staff {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--orange);
    border: 1px solid rgba(236,110,37,0.3);
    padding: 10px 20px;
    border-radius: 8px;
    text-transform: uppercase;
    margin-bottom: 20px;
    max-width: 320px;
  }

  .played-status {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--green);
    opacity: 0.4;
    margin-bottom: 6px;
  }

  .played-phrase {
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--green);
    opacity: 0.25;
  }

  /* ─── BG ─── */
  canvas#bgCanvas {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  canvas#confettiCanvas {
    position: fixed; inset: 0;
    z-index: 350;
    pointer-events: none;
  }

  /* ─── ADMIN ─── */
  .admin-panel {
    display: none;
    position: fixed; inset: 0;
    z-index: 500;
    background: rgba(2,1,2,0.97);
    padding: 24px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .admin-panel.active { display: block; }
  .admin-panel h3 {
    color: var(--purple); font-size: 13px;
    margin-bottom: 16px; letter-spacing: 3px; text-align: center;
  }
  .admin-panel .stat {
    display: flex; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 11px;
  }
  .admin-panel .stat-val { color: var(--green); font-weight: 700; }
  .admin-panel .admin-actions {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .admin-panel .btn-admin {
    flex: 1;
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    padding: 14px; border-radius: 8px; cursor: pointer;
    letter-spacing: 1px; text-transform: uppercase;
    border: 1.5px solid; background: none;
  }
  .btn-admin.close-admin { border-color: var(--steel); color: var(--steel); }
  .btn-admin.export-admin { border-color: var(--green); color: var(--green); }
  .btn-admin.reset-admin { border-color: var(--red); color: var(--red); }
</style>
</head>

function pickPrize() {
  var available = PRIZES.filter(function(p) { return (globalState.prizes[p.id] || 0) < p.daily_limit; });
  if (!available.length) return PRIZES.find(function(p) { return p.id === 'rifa'; }) || null;

  var total = available.reduce(function(s, p) { return s + p.weight; }, 0);
  var r = Math.random() * total;
  for (var i = 0; i < available.length; i++) {
    r -= available[i].weight;
    if (r <= 0) return available[i];
  }
  return available[available.length - 1];
}

// ═══════════════════════════════════════════════
// WHEEL
// ═══════════════════════════════════════════════

var wheelCanvas = document.getElementById('wheelCanvas');
var ctx = wheelCanvas.getContext('2d');

var DPR = Math.min(window.devicePixelRatio || 1, 3);
var SIZE = 1000;
wheelCanvas.width = SIZE * DPR;
wheelCanvas.height = SIZE * DPR;
ctx.scale(DPR, DPR);

var currentAngle = 0;
var isSpinning = false;

function drawWheel(angle) {
  var cx = SIZE / 2;
  var cy = SIZE / 2;
  var R = cx - 14;

  ctx.clearRect(0, 0, SIZE, SIZE);

  ctx.beginPath();
  ctx.arc(cx, cy, R + 4, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(130,253,71,0.12)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  for (var i = 0; i < SEGMENTS; i++) {
    var start = angle + i * ARC;
    var end = start + ARC;
    var p = PRIZES[i];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, start, end);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, start, end);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(2,1,2,0.6)';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + ARC / 2);

    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.icon, R - 42, 0);

    ctx.font = '300 28px "DesignDesign", "Space Mono", monospace';
    ctx.textAlign = 'center';
    var lines = p.label.split('\n');
    var lineH = 30;
    var textX = R * 0.50;
    var startY = -(lines.length - 1) * lineH / 2;

    ctx.fillStyle = (p.textColor === '#020102') ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.4)';
    for (var li = 0; li < lines.length; li++) {
      ctx.fillText(lines[li], textX + 1.5, startY + li * lineH + 1.5);
    }
    ctx.fillStyle = p.textColor;
    for (var li = 0; li < lines.length; li++) {
      ctx.fillText(lines[li], textX, startY + li * lineH);
    }

    ctx.restore();
  }

  var innerR = 48;
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, 2 * Math.PI);
  ctx.fillStyle = '#020102';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(130,253,71,0.35)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

drawWheel(0);

// VALIDATION
// ═══════════════════════════════════════════════

var CO_PREFIXES = ['300','301','302','303','304','305','310','311','312','313','314','315','316','317','318','319','320','321','322','323','324','325','350','351'];

function validatePhone(raw) {
  var digits = raw.replace(/\D/g, '');
  if (digits.length !== 10) return false;
  return CO_PREFIXES.indexOf(digits.substring(0, 3)) !== -1;
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim());
}

var codeAttempts = 0;
var MAX_ATTEMPTS = 5;
var cooldownUntil = 0;

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}

function clearErrors() {
  document.getElementById('errorMsg').classList.remove('visible');
  document.getElementById('inputCode').classList.remove('error');
  document.getElementById('inputName').classList.remove('error');
  document.getElementById('inputEmail').classList.remove('error');
  document.getElementById('inputPhone').classList.remove('error');
  document.getElementById('attemptsWarn').classList.remove('visible');
}

// ═══════════════════════════════════════════════
// SUBMIT
// ═══════════════════════════════════════════════

var isSubmitting = false;

function submitAndSpin() {
  if (isSubmitting || isSpinning) return;
  clearErrors();

  // Cooldown check
  if (Date.now() < cooldownUntil) {
    var secs = Math.ceil((cooldownUntil - Date.now()) / 1000);
    showError('Espera ' + secs + ' segundos para intentar de nuevo');
    return;
  }

  var codeInput = document.getElementById('inputCode');
  var nameInput = document.getElementById('inputName');
  var emailInput = document.getElementById('inputEmail');
  var phoneInput = document.getElementById('inputPhone');

  var consentCheck = document.getElementById('consentCheck');
  var consentRow = document.getElementById('consentRow');

  var code = codeInput.value.trim().toUpperCase();
  var name = nameInput.value.trim();
  var email = emailInput.value.trim();
  var phone = phoneInput.value.replace(/\D/g, '');

  // Clear consent error
  consentRow.classList.remove('error-consent');

  // Validate code
  if (!code || code.length < 8) {
    codeInput.classList.add('error');
    showError('Ingresa el codigo de tu compra');
    codeInput.focus();
    return;
  }

  if (!VALID_CODES.has(code)) {
    codeAttempts++;
    codeInput.classList.add('error');
    if (codeAttempts >= MAX_ATTEMPTS) {
      cooldownUntil = Date.now() + 30000;
      showError('Demasiados intentos. Espera 30 segundos.');
      var warn = document.getElementById('attemptsWarn');
      warn.textContent = 'Si no tienes un codigo valido, compra un cafe para obtener uno.';
      warn.classList.add('visible');
    } else {
      showError('Codigo no valido (' + (MAX_ATTEMPTS - codeAttempts) + ' intentos restantes)');
    }
    return;
  }

  // Check if code already used
  if (globalState.usedCodes && globalState.usedCodes.indexOf(code) !== -1) {
    codeInput.classList.add('error');
    showError('Este codigo ya fue utilizado');
    return;
  }

  // Validate name
  if (!name || name.length < 2) {
    nameInput.classList.add('error');
    showError('Ingresa tu nombre');
    nameInput.focus();
    return;
  }
  if (name.length > 60) {
    nameInput.classList.add('error');
    showError('Nombre muy largo (max 60 caracteres)');
    nameInput.focus();
    return;
  }

  // Validate email
  if (!validateEmail(email)) {
    emailInput.classList.add('error');
    showError('Correo no valido');
    emailInput.focus();
    return;
  }

  // Validate phone
  if (!validatePhone(phone)) {
    phoneInput.classList.add('error');
    showError('WhatsApp: 10 digitos (ej: 3001234567)');
    phoneInput.focus();
    return;
  }

  // Validate consent
  if (!consentCheck.checked) {
    consentRow.classList.add('error-consent');
    showError('Debes autorizar el tratamiento de datos para participar');
    return;
  }

  // Pick prize
  var prize = pickPrize();
  if (!prize) {
    showError('Premios agotados por hoy. Vuelve manana!');
    return;
  }

  // Lock
  isSubmitting = true;
  var goBtn = document.getElementById('btnGo');
  goBtn.disabled = true;

  // Save to global state
  var leadData = { name: name, email: email, phone: phone, code: code, prize: prize.id, time: new Date().toISOString() };
  globalState.leads.push(leadData);
  globalState.spins++;
  globalState.prizes[prize.id] = (globalState.prizes[prize.id] || 0) + 1;
  if (!globalState.usedCodes) globalState.usedCodes = [];
  globalState.usedCodes.push(code);
  saveGlobalState(globalState);

  // Send to Google Sheets (fire and forget)
  sendToSheet(leadData);

  // Save local played
  saveLocalPlayed({ date: TODAY, prize: prize.id, name: name });

  // Transition to wheel
  showWheelAndSpin(name, prize);
}

function hideAllScreens() {

function showWheelAndSpin(name, prize) {
  hideAllScreens();
  document.getElementById('wheelScreen').classList.add('active');
  document.getElementById('playerName').textContent = name.toUpperCase();

  // Auto-spin after a brief moment
  setTimeout(function() { spin(prize, name); }, 600);
}

// ═══════════════════════════════════════════════
// SPIN
// ═══════════════════════════════════════════════

function spin(prize, playerName) {
  isSpinning = true;
  var hub = document.getElementById('centerHub');
  hub.classList.add('spinning');

  var prizeIndex = PRIZES.indexOf(prize);
  var targetSegCenter = prizeIndex * ARC + ARC / 2;
  var targetAngle = (3 * Math.PI / 2) - targetSegCenter;
  var fullRotations = 7 + Math.floor(Math.random() * 3);
  var totalSpin = fullRotations * 2 * Math.PI + (targetAngle - (currentAngle % (2 * Math.PI)));

  var startAngle = currentAngle;
  var duration = 5000 + Math.random() * 1500;
  var startTime = performance.now();
  var pointer = document.getElementById('pointer');
  var lastSegment = -1;

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4.5);
  }

  function animate(now) {
    var elapsed = now - startTime;
    var t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + totalSpin * easeOut(t);
    drawWheel(currentAngle);

    var normAngle = ((3 * Math.PI / 2) - currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    var seg = Math.floor(normAngle / ARC) % SEGMENTS;
    if (seg !== lastSegment) {
      lastSegment = seg;
      pointer.classList.add('tick');
      if (navigator.vibrate) navigator.vibrate(10);
      setTimeout(function() { pointer.classList.remove('tick'); }, 50);
    }

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      hub.classList.remove('spinning');
      showResult(prize, playerName);
    }
  }
  requestAnimationFrame(animate);
}

function showResult(prize, playerName) {
  var isWinner = prize.id === 'entrada';
  hideAllScreens();
  var screen = document.getElementById('resultScreen');
  screen.classList.add('active');
  if (isWinner) screen.classList.add('winner');

  document.getElementById('rIcon').textContent = prize.icon;
  document.getElementById('rPhrase').textContent = randomPhrase();
  document.getElementById('rLabel').textContent = isWinner ? 'GANADOR' : 'TU PREMIO';
  document.getElementById('rName').textContent = prize.label.replace('\n', ' ');
  document.getElementById('rDesc').textContent = prize.desc;
  document.getElementById('rPlayer').textContent = playerName ? playerName.toUpperCase() : '';

  var codeEl = document.getElementById('rCode');
  if (prize.code) {
    codeEl.innerHTML = prize.code + '<span class="tap-hint">TAP PARA COPIAR</span>';
    codeEl.classList.add('visible');
  } else {
    codeEl.classList.remove('visible');
  }

  if (isWinner) launchConfetti();
}

function copyCode(el) {
  var text = el.textContent.replace('TAP PARA COPIAR', '').trim();
  function onCopied() {
    el.innerHTML = 'COPIADO \u2713';
    setTimeout(function() {
      el.innerHTML = text + '<span class="tap-hint">TAP PARA COPIAR</span>';
    }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onCopied).catch(function() { fallbackCopy(text, onCopied); });
  } else {
    fallbackCopy(text, onCopied);
  }
}

function fallbackCopy(text, cb) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); if (cb) cb(); } catch(e) {}
  document.body.removeChild(ta);
}

// ═══════════════════════════════════════════════

function updateCounter() {
  var entradaPrize = PRIZES.find(function(p) { return p.id === 'entrada'; });
  var left = entradaPrize.daily_limit - (globalState.prizes['entrada'] || 0);
  var el = document.getElementById('counterDisplay');
  if (left > 0) {
    el.textContent = left + ' entrada' + (left > 1 ? 's' : '') + ' doble' + (left > 1 ? 's' : '') + ' disponible' + (left > 1 ? 's' : '');
  } else {
    el.textContent = 'Entradas agotadas hoy';
    el.style.color = '#FF4B43';
  }
}

// CONFETTI
// ═══════════════════════════════════════════════

function launchConfetti() {
  var c = document.getElementById('confettiCanvas');
  var cCtx = c.getContext('2d');
  c.width = window.innerWidth * DPR;
  c.height = window.innerHeight * DPR;
  c.style.width = window.innerWidth + 'px';
  c.style.height = window.innerHeight + 'px';
  cCtx.scale(DPR, DPR);

  var W = window.innerWidth;
  var H = window.innerHeight;
  var colors = ['#82FD47', '#EC6E25', '#7D3BED', '#FF4B43', '#224FD1', '#AEE1F6'];
  var particles = [];
  for (var i = 0; i < 120; i++) {
    particles.push({
      x: W / 2 + (Math.random() - 0.5) * W * 0.7,
      y: H * 0.4,
      vx: (Math.random() - 0.5) * 16,
      vy: -(Math.random() * 16 + 6),
      size: Math.random() * 8 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 14,
      life: 1,
    });
  }

  function draw() {
    cCtx.clearRect(0, 0, W, H);
    var alive = false;
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      if (p.life <= 0) continue;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += 0.3;
      p.rot += p.rotV; p.life -= 0.006;
      cCtx.save();
      cCtx.translate(p.x, p.y);
      cCtx.rotate(p.rot * Math.PI / 180);
      cCtx.globalAlpha = Math.max(0, p.life);
      cCtx.fillStyle = p.color;
      cCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.5);
      cCtx.restore();
    }
    if (alive) requestAnimationFrame(draw);
    else cCtx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(draw);
}

// ═══════════════════════════════════════════════
// BACKGROUND PARTICLES
// ═══════════════════════════════════════════════

(function() {
  var c = document.getElementById('bgCanvas');
  var bCtx = c.getContext('2d');
  var W, H;
  function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  var dots = [];
  for (var i = 0; i < 20; i++) {
    var colorArr = ['#82FD47', '#7D3BED', '#224FD1'];
    dots.push({
      x: Math.random() * (W || 400),
      y: Math.random() * (H || 800),
      r: Math.random() * 1.2 + 0.4,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.2,
      color: colorArr[Math.floor(Math.random() * 3)],
    });
  }

  function draw() {
    bCtx.clearRect(0, 0, W, H);
    bCtx.globalAlpha = 0.15;
    for (var j = 0; j < dots.length; j++) {
      var d = dots[j];
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
      if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;
      bCtx.beginPath();
      bCtx.arc(d.x, d.y, d.r, 0, 2 * Math.PI);
      bCtx.fillStyle = d.color;
      bCtx.fill();
    }
    bCtx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ═══════════════════════════════════════════════
// ADMIN (triple-tap footer on wheel screen)
// ═══════════════════════════════════════════════

var tapCount = 0;
var tapTimer = null;
document.getElementById('footer').addEventListener('click', function() {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(function() { tapCount = 0; }, 600);
  if (tapCount >= 3) { tapCount = 0; toggleAdmin(); }
});

function toggleAdmin() {
  var panel = document.getElementById('adminPanel');
  panel.classList.toggle('active');
  if (panel.classList.contains('active')) updateAdmin();
}

function updateAdmin() {
  var html = '<div class="stat"><span>Total giros</span><span class="stat-val">' + globalState.spins + '</span></div>';
  for (var i = 0; i < PRIZES.length; i++) {
    var p = PRIZES[i];
    var count = globalState.prizes[p.id] || 0;
    html += '<div class="stat"><span>' + p.icon + ' ' + p.label.replace('\n',' ') + '</span><span class="stat-val">' + count + '/' + p.daily_limit + '</span></div>';
  }
  html += '<div class="stat"><span>Leads capturados</span><span class="stat-val">' + globalState.leads.length + '</span></div>';
  html += '<div class="stat"><span>Codigos usados</span><span class="stat-val">' + (globalState.usedCodes ? globalState.usedCodes.length : 0) + '/200</span></div>';
  document.getElementById('adminStats').innerHTML = html;
}

function csvEscape(val) {
  var s = String(val || '');
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportCSV() {
  if (!globalState.leads.length) { alert('No hay leads para exportar.'); return; }
  var csv = '\uFEFF' + 'Nombre,Email,WhatsApp,Codigo,Premio,Hora\n';
  for (var i = 0; i < globalState.leads.length; i++) {
    var l = globalState.leads[i];
    csv += csvEscape(l.name) + ',' + csvEscape(l.email) + ',' + csvEscape(l.phone) + ',' + csvEscape(l.code) + ',' + csvEscape(l.prize) + ',' + csvEscape(l.time) + '\n';
  }
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'leads-salentino-ritvales-' + TODAY + '.csv'; a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 100);
}

function resetDay() {
  if (confirm('Resetear todos los datos del dia?')) {
    globalState = { date: TODAY, spins: 0, leads: [], prizes: {}, usedCodes: [] };
    saveGlobalState(globalState);
    updateCounter();
    updateAdmin();
  }
}

// ═══════════════════════════════════════════════
// PHONE AUTO-FORMAT
// ═══════════════════════════════════════════════

document.getElementById('inputPhone').addEventListener('input', function() {
  var raw = this.value.replace(/\D/g, '');
  if (raw.length > 10) raw = raw.substring(0, 10);
  var formatted = '';
  if (raw.length > 0) formatted = raw.substring(0, 3);
  if (raw.length > 3) formatted += ' ' + raw.substring(3, 6);
  if (raw.length > 6) formatted += ' ' + raw.substring(6, 10);
  this.value = formatted;
});

// Code auto-format
document.getElementById('inputCode').addEventListener('input', function() {
  var raw = this.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  if (raw.length > 7) raw = raw.substring(0, 7);
  if (raw.length > 3) {
    this.value = raw.substring(0, 3) + '-' + raw.substring(3);
  } else {
    this.value = raw;
  }
});

// ═══════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════

document.getElementById('entryScreen').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitAndSpin();
});

// Prevent pull-to-refresh
document.addEventListener('touchmove', function(e) {
  if (e.target.closest && !e.target.closest('.admin-panel')) {
    e.preventDefault();
  }
}, { passive: false });

// Resize
window.addEventListener('resize', function() {
  drawWheel(currentAngle);
});
